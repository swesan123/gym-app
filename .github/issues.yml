issues:
  - title: Adopt free-exercise-db muscle/equipment taxonomy
    body: |
      Follow-up from #97. Use the public-domain [free-exercise-db](https://github.com/yuhonas/free-exercise-db) (Unlicense) taxonomy for `muscle`, `equipment`, and `mechanic` instead of free-text muscle names, so the AI chat and progress views can group exercises consistently. Optionally seed instructions/images for existing exercises by name match.
    labels: ["type: enhancement", "backend", "priority: low"]

  - title: Wall-clock rest timer that survives backgrounding
    body: |
      Follow-up from #97. Port the rest-timer approach from [GymCoach](https://github.com/gymcoach-app/gymcoach) `lib/rest-timer.ts` (MIT): store `endsAt` / `pausedRemainingMs` instead of ticking state, pure functions taking `now`, +/-15s adjust. Pair with wake-lock and vibration helpers so the timer is accurate when iOS Safari backgrounds the tab.
    labels: ["type: enhancement", "ui", "priority: medium"]

  - title: Intra-set RIR autoregulation suggestions in Focus view
    body: |
      Follow-up from #97. After logging a set's RIR, suggest the next set's load/reps (reference: GymCoach `lib/intra-set-autoregulation.ts`, MIT) and snap suggestions to the exercise's machine weight options (GymCoach `lib/gym-loads.ts`). Suggestions only; never auto-change logged values.
    labels: ["type: feature", "ui", "priority: medium"]

  - title: Keep Supabase project from auto-pausing
    body: |
      The free-tier Supabase project paused after a week of inactivity and the app returned 500s on History/Progress. Add a scheduled GitHub Action (every 3 days) that runs a trivial query against the database, and confirm the daily backup workflow is still enabled (GitHub disables scheduled workflows after 60 days without repo activity).
    labels: ["type: chore", "backend", "priority: high"]

  - title: Rate-limit passcode login attempts
    body: |
      Follow-up from #97 security review. `login` only adds a 400ms delay on failure. Add durable rate limiting (e.g. Vercel Firewall rate-limit rule on POST /login, or a Supabase-backed attempt counter with exponential backoff) so a short passcode can't be brute-forced.
    labels: ["type: enhancement", "backend", "priority: medium"]
