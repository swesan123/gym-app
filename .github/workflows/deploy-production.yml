name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-db:
    name: Migrate Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply migrations
        env:
          SUPABASE_MIGRATION_DB_URL: ${{ secrets.SUPABASE_MIGRATION_DB_URL }}
        run: |
          if [ -z "$SUPABASE_MIGRATION_DB_URL" ]; then
            echo "Missing GitHub secret: SUPABASE_MIGRATION_DB_URL"
            echo "Set it to the Supabase pooler/direct Postgres URI used for CI migrations."
            exit 1
          fi
          # The Supabase project is shared with another app whose migrations are recorded in the
          # same history table, which makes `supabase db push` refuse to run. Apply only this
          # repo's migration files that are not yet recorded, each in its own transaction.
          applied=$(psql "$SUPABASE_MIGRATION_DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select version from supabase_migrations.schema_migrations")
          pending=0
          for file in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$file" .sql)
            version=${base%%_*}
            name=${base#*_}
            if grep -qx "$version" <<< "$applied"; then
              continue
            fi
            if ! [[ "$version" =~ ^[0-9]{14}$ && "$name" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "Unexpected migration filename: $base"
              exit 1
            fi
            echo "Applying $base"
            psql "$SUPABASE_MIGRATION_DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
              -f "$file" \
              -c "insert into supabase_migrations.schema_migrations (version, name) values ('$version', '$name')"
            pending=$((pending + 1))
          done
          echo "Applied $pending migration(s)."

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: migrate-db
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build deployment artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
